# Moumusic — FULL-FEATURE variant (iOS 26+). Includes the CiliCili (Bilibili) framework and Metal wallpapers.
# The compatibility variant (iOS 15-18) is project-compat.yml.
name: Moumusic

options:
  deploymentTarget:
    iOS: "26.0"

settings:
  base:
    SWIFT_VERSION: "5.0"

targets:
  CiliCiliKit:
    type: framework
    platform: iOS
    sources:
      - path: Modules/CiliCili/Sources
      - path: Modules/CiliCili/Bridge
    settings:
      base:
        PRODUCT_NAME: CiliCiliKit
        PRODUCT_BUNDLE_IDENTIFIER: com.jiajia2222.moumusic.ios.cilicili
        DEFINES_MODULE: YES
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "3.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SKIP_INSTALL: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO

  MoumusicLiveActivity:
    type: app-extension
    platform: iOS
    sources:
      - path: MoumusicLiveActivity
      - path: Moumusic/LiveActivity/MoumusicActivityAttributes.swift
    settings:
      base:
        PRODUCT_NAME: MoumusicLiveActivity
        PRODUCT_BUNDLE_IDENTIFIER: com.jiajia2222.moumusic.ios.liveactivity
        MARKETING_VERSION: "3.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
    info:
      path: MoumusicLiveActivity/Info.plist
      properties:
        CFBundleDisplayName: Moumusic
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  Moumusic:
    type: application
    platform: iOS
    sources:
      - path: Moumusic
        excludes:
          - "en.lproj"
          - "zh-Hans.lproj"
    resources:
      - Moumusic/en.lproj
      - Moumusic/zh-Hans.lproj
      - Moumusic/XProfile.html
      - Modules/CiliCili/Assets/CiliCiliAssets.xcassets
    dependencies:
      - target: CiliCiliKit
        embed: true
      - target: MoumusicLiveActivity
    settings:
      base:
        PRODUCT_NAME: Moumusic
        PRODUCT_BUNDLE_IDENTIFIER: com.jiajia2222.moumusic.ios
        MARKETING_VERSION: "3.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_OBJC_BRIDGING_HEADER: Moumusic/Beans-Bridging-Header.h
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Moumusic/Info.plist
      properties:
        CFBundleDisplayName: Moumusic
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIBackgroundModes: [audio]
        UILaunchScreen:
          UIImageName: LaunchBackground
          UIColorName: LaunchBackgroundColor
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIFileSharingEnabled: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            CPTemplateApplicationSceneSessionRoleApplication:
              - UISceneConfigurationName: CarPlay
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).CarPlaySceneDelegate
        LSSupportsOpeningDocumentsInPlace: true
        CADisableMinimumFrameDurationOnPhone: true
        NSSupportsLiveActivities: true
        NSPhotoLibraryAddUsageDescription: 用于将图片和视频保存到系统照片图库。
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true

schemes:
  Moumusic:
    build:
      targets:
        Moumusic: all
    run:
      config: Debug
    archive:
      config: Release
