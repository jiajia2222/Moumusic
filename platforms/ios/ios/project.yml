# XcodeGen manifest for the iOS app shell.
# Regenerate the project with: cd ios && xcodegen generate
name: KumoneIOS
options:
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig
packages:
  KumoneIOSPackage:
    path: KumoneIOSPackage
targets:
  KumoneIOS:
    type: application
    platform: iOS
    sources:
      - KumoneIOS
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    dependencies:
      - package: KumoneIOSPackage
        product: KumoneIOSFeature
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: Config/KumoneIOS.entitlements
        ENABLE_PREVIEWS: YES
  KumoneIOSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - KumoneIOSUITests
    configFiles:
      Debug: Config/Tests.xcconfig
      Release: Config/Tests.xcconfig
    dependencies:
      - target: KumoneIOS
  MoumusicWidget:
    type: app-extension
    platform: iOS
    sources:
      - MoumusicWidget
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jiajia2222.moumusic.ios.widget
        INFOPLIST_KEY_CFBundleDisplayName: Moumusic 歌词
        CODE_SIGN_ENTITLEMENTS: Config/MoumusicWidget.entitlements
schemes:
  KumoneIOS:
    build:
      targets:
        KumoneIOS: all
        MoumusicWidget: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - KumoneIOSUITests
    archive:
      config: Release
