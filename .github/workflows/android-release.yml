name: Android release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: platforms/android/package-lock.json

      - name: Use Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Configure public Git dependencies
        run: |
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Install JavaScript dependencies
        working-directory: platforms/android
        run: npm ci --ignore-scripts

      - name: Configure Android release signing
        working-directory: platforms/android/android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release.p12
          chmod 600 release.p12
          printf 'storeFile=release.p12\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \\
            "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_ALIAS" "$ANDROID_KEY_PASSWORD" > keystore.properties
          chmod 600 keystore.properties

      - name: Build signed release APK
        working-directory: platforms/android/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Prepare stable signed APK filename
        working-directory: platforms/android/android
        run: |
          apk=$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*universal.apk' -print -quit)
          test -n "$apk"
          cp "$apk" app/build/outputs/apk/release/Moumusic-android-signed.apk

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Moumusic-android-signed
          path: platforms/android/android/app/build/outputs/apk/release/Moumusic-android-signed.apk
          if-no-files-found: error

      - name: Attach signed APK to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: platforms/android/android/app/build/outputs/apk/release/Moumusic-android-signed.apk

      - name: Remove signing material
        if: always()
        working-directory: platforms/android/android
        run: rm -f release.p12 keystore.properties
