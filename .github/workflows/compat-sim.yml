name: compat simulator check

# Manual diagnosis aid: builds the iOS 15-18 compatibility tree for the simulator, launches it on the oldest
# iPhone runtime it can get (an older runtime is downloaded when the image only has iOS 26) and uploads
# screenshots, so blank screens can be seen without a device.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sim:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - name: Prepare iOS 15 tree
        run: bash platforms/ios15/prepare.sh

      - name: Force the iOS 15-18 interface
        run: |
          python3 - <<'EOF'
          import pathlib
          path = pathlib.Path("platforms/ios/Sources/Kumone/Features/IOSMainWindow.swift")
          text = path.read_text(encoding="utf-8-sig")
          old = "if #available(iOS 26.0, *) {\n            iOS26TabInterface"
          new = "if false, #available(iOS 26.0, *) {\n            iOS26TabInterface"
          assert old in text
          path.write_text(text.replace(old, new), encoding="utf-8")
          EOF

      - name: Install XcodeGen
        run: HOMEBREW_NO_REQUIRE_TAP_TRUST=1 brew install xcodegen

      - name: Generate Xcode project
        working-directory: platforms/ios/ios
        run: xcodegen generate

      - name: Install an older iOS simulator runtime
        continue-on-error: true
        run: |
          xcrun simctl list runtimes
          for version in 16.4 17.5 18.6; do
            if xcodebuild -downloadPlatform iOS -buildVersion "$version"; then
              echo "downloaded iOS $version"
              break
            fi
          done
          xcrun simctl list runtimes

      - name: Pick the oldest iPhone simulator
        run: |
          python3 - <<'EOF' > sim.env
          import json, subprocess
          def run(*args):
              return json.loads(subprocess.check_output(["xcrun", "simctl", *args, "--json"]))
          runtimes = [r for r in run("list", "runtimes")["runtimes"]
                      if r.get("isAvailable") and r["identifier"].split(".")[-1].startswith("iOS")]
          def version(rt):
              return tuple(int(p) for p in rt["version"].split("."))
          runtimes.sort(key=version)
          rt = runtimes[0]
          devices = run("list", "devices", "available")["devices"].get(rt["identifier"], [])
          phones = [d for d in devices if "iPhone" in d["name"]]
          if phones:
              udid = phones[-1]["udid"]
          else:
              types = [t for t in run("list", "devicetypes")["devicetypes"] if "iPhone" in t["name"]]
              preferred = [t for t in types if t["name"] in ("iPhone 14", "iPhone 15", "iPhone 13")] or types
              udid = subprocess.check_output(["xcrun", "simctl", "create", "compat-test", preferred[0]["identifier"],
                                              rt["identifier"]]).decode().strip()
          print("UDID=" + udid)
          print("RUNTIME=" + rt["version"])
          EOF
          cat sim.env
          cat sim.env >> "$GITHUB_ENV"

      - name: Build for the simulator
        working-directory: platforms/ios/ios
        run: |
          set -o pipefail
          xcodebuild \
            -project KumoneIOS.xcodeproj \
            -scheme KumoneIOS \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "id=$UDID" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO DEVELOPMENT_TEAM= \
            build 2>&1 | tail -n 60

      - name: Launch and take screenshots
        working-directory: platforms/ios/ios
        run: |
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          APP=$(ls -d build/Build/Products/Debug-iphonesimulator/*.app | head -1)
          BUNDLE=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist")
          echo "app=$APP bundle=$BUNDLE runtime=$RUNTIME"
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch "$UDID" "$BUNDLE" -moumusic.skipUpdateCheck YES
          mkdir -p shots
          echo "$RUNTIME" > shots/runtime.txt
          sleep 10
          xcrun simctl io "$UDID" screenshot shots/home-10s.png
          sleep 20
          xcrun simctl io "$UDID" screenshot shots/home-30s.png
          sleep 20
          xcrun simctl io "$UDID" screenshot shots/home-50s.png
          xcrun simctl spawn "$UDID" log show --last 3m --style compact --predicate 'process == "MoumusicIOS"' > shots/app.log || true

      - name: UI navigation screenshots
        continue-on-error: true
        working-directory: platforms/ios/ios
        run: |
          mkdir -p shots
          TEST_RUNNER_SHOT_DIR="$PWD/shots" xcodebuild test             -project KumoneIOS.xcodeproj             -scheme KumoneIOS             -destination "id=$UDID"             -derivedDataPath build             -only-testing:KumoneIOSUITests/CompatNavigationShots             CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO DEVELOPMENT_TEAM= 2>&1 | tail -n 60

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compat-sim-shots
          path: platforms/ios/ios/shots
