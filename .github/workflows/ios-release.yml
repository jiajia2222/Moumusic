name: iOS unsigned release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: macos-26
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: platforms/android/package-lock.json

      - name: Configure public Git dependencies
        shell: bash
        run: |
          git config --global url."https://github.com/".insteadOf git+ssh://git@github.com/
          git config --global url."https://github.com/".insteadOf ssh://git@github.com/

      - name: Install JavaScript dependencies
        working-directory: platforms/android
        run: npm ci --ignore-scripts

      - name: Install CocoaPods dependencies
        working-directory: platforms/android/ios
        run: pod install

      - name: Build unsigned iOS app
        working-directory: platforms/android/ios
        run: |
          xcodebuild \
            -workspace LxMusicMobile.xcworkspace \
            -scheme LxMusicMobile \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM= \
            LIBRARY_SEARCH_PATHS='$(inherited) $(TOOLCHAIN_DIR)/usr/lib/swift/iphoneos' \
            build
          mkdir -p dist/Payload
          cp -R build/Build/Products/Release-iphoneos/LxMusicMobile.app dist/Payload/Moumusic.app
          ditto -c -k --sequesterRsrc --keepParent dist/Payload dist/Moumusic-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Moumusic-ios-unsigned
          path: platforms/android/ios/dist/Moumusic-unsigned.ipa
          if-no-files-found: error

      - name: Attach IPA to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: platforms/android/ios/dist/Moumusic-unsigned.ipa
