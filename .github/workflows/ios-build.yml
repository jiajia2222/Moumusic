name: iOS unsigned IPAs

# Two unsigned IPAs. Never creates a release.
#   full   : platforms/ios         (Kumone-based Moumusic, iOS 26+, all features)
#   compat : platforms/ios-compat  (Beans-based compatibility build, iOS 15-18, MOUMUSIC_COMPAT)
on:
  workflow_dispatch:
  push:
    branches: [refactor/beans-ui]
    paths:
      - "platforms/ios/**"
      - "platforms/ios-compat/**"
      - ".github/workflows/ios-build.yml"

permissions:
  contents: read

jobs:
  full:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Install XcodeGen
        run: HOMEBREW_NO_REQUIRE_TAP_TRUST=1 brew install xcodegen

      - name: Generate Xcode project
        working-directory: platforms/ios/ios
        run: xcodegen generate

      - name: Build (unsigned)
        working-directory: platforms/ios/ios
        run: |
          set -o pipefail
          xcodebuild \
            -project KumoneIOS.xcodeproj \
            -scheme KumoneIOS \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO DEVELOPMENT_TEAM= \
            build 2>&1 | tee build.log | tail -n 400

      - name: Package IPA
        working-directory: platforms/ios/ios
        run: |
          mkdir -p dist/Payload
          cp -R build/Build/Products/Release-iphoneos/MoumusicIOS.app dist/Payload/Moumusic.app
          plutil -p dist/Payload/Moumusic.app/Info.plist | grep -E "CFBundleShortVersionString|CFBundleVersion|MinimumOSVersion"
          ditto -c -k --sequesterRsrc --keepParent dist/Payload dist/Moumusic-full-ios26-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Moumusic-full-ios26-unsigned
          path: platforms/ios/ios/dist/Moumusic-full-ios26-unsigned.ipa

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log-full-ios26
          path: platforms/ios/ios/build.log

  compat:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Install XcodeGen
        run: HOMEBREW_NO_REQUIRE_TAP_TRUST=1 brew install xcodegen

      - name: Generate project
        working-directory: platforms/ios-compat
        run: xcodegen generate --spec project-compat.yml

      - name: Build (unsigned)
        working-directory: platforms/ios-compat
        run: |
          set -o pipefail
          xcodebuild \
            -project Moumusic.xcodeproj \
            -scheme Moumusic \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log | tail -n 400

      - name: Package IPA
        working-directory: platforms/ios-compat
        run: |
          rm -rf Payload && mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Moumusic.app Payload/
          plutil -p Payload/Moumusic.app/Info.plist | grep -E "CFBundleShortVersionString|CFBundleVersion|MinimumOSVersion"
          ditto -c -k --sequesterRsrc --keepParent Payload Moumusic-compat-ios15-18-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Moumusic-compat-ios15-18-unsigned
          path: platforms/ios-compat/Moumusic-compat-ios15-18-unsigned.ipa

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log-compat-ios15-18
          path: platforms/ios-compat/build.log

  # Every successful build is uploaded to the update host; the app polls its manifest.
  publish:
    needs: [full, compat]
    if: github.ref == 'refs/heads/refactor/beans-ui'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: Moumusic-full-ios26-unsigned
          path: dl/full

      - uses: actions/download-artifact@v4
        with:
          name: Moumusic-compat-ios15-18-unsigned
          path: dl/compat

      - name: Upload to yun.nadev.xyz
        env:
          IMGBED_TOKEN: ${{ secrets.IMGBED_TOKEN }}
          BUILD: ${{ github.run_number }}
          FULL_IPA: dl/full/Moumusic-full-ios26-unsigned.ipa
          COMPAT_IPA: dl/compat/Moumusic-compat-ios15-18-unsigned.ipa
        run: |
          export VERSION="$(grep -m1 'MARKETING_VERSION' platforms/ios-compat/project-compat.yml | sed -E 's/.*"([^"]+)".*/\1/')"
          export NOTES="$(git log -1 --pretty=%s)"
          python3 .github/scripts/publish_update.py
