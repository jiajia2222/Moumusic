name: Feature request
description: 提议一个具体、可说明使用场景的新功能或改进
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 这个需求解决什么实际问题？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 功能建议
      description: 请描述希望看到的行为、界面或交互。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 如果有临时解决办法或参考项目，也请一并说明。
  - type: dropdown
    id: platform
    attributes:
      label: 目标平台
      options:
        - iOS
        - macOS
        - Android
        - Windows
        - 全平台
        - 其他
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue，确认没有重复建议。
          required: true
